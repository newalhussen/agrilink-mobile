[versions]
agp = "8.12.1"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
composeBom = "2025.09.01"
coreKtx = "1.17.0"
appcompat = "1.7.1"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
navigation = "2.9.5"
room = "2.7.2"
work = "2.10.5"
securityCrypto = "1.1.0"
datastore = "1.1.7"
splash = "1.0.1"
coroutines = "1.10.2"
serialization = "1.9.0"
retrofit = "3.0.0"
okhttp = "4.12.0"
coil = "3.3.0"
zxing = "3.5.3"
codeScanner = "16.1.0"
junit = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
